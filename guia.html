<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía · Cómo instalar la app de Médicos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16120e;--card:#211b15;--card2:#2b241d;--line:#3a3027;--ink:#f0e8da;--mut:#b3a99b;--acc:#f7a823;--accx:#281a08;--soft:#3a2a12;--ok:#8fd19e;--blue:#8db4ff}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:#0d0a08;color:var(--ink);font:15px/1.4 "Hanken Grotesk",system-ui,sans-serif;padding:20px 12px 40px}
.intro{max-width:1100px;margin:0 auto 14px}.intro h1{font:700 26px Fraunces,serif;margin:0 0 6px}.intro p{margin:0;color:var(--mut);max-width:760px}
.sel{max-width:1100px;margin:0 auto 14px;display:flex;gap:8px}.sel button{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 14px inherit;cursor:pointer}.sel button.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:360px;max-width:100%;height:740px;border:1px solid #2c2620;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 20px 50px #0008;flex:none;background:var(--bg)}
.scr{position:absolute;inset:0;overflow:hidden}
.pasos{flex:1;min-width:290px;max-width:560px}.pasos h2{font:700 21px Fraunces,serif;margin:4px 0 10px}
.pasos ol{list-style:none;margin:0;padding:0;counter-reset:n}.pasos li{counter-increment:n;padding:10px 12px 10px 44px;margin-bottom:8px;border:1px solid var(--line);border-radius:14px;background:#14100c;position:relative;cursor:pointer;color:#d9cfbf;font-size:14px}
.pasos li:before{content:counter(n);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--card2);color:var(--mut);font-weight:700;font-size:13px;display:grid;place-items:center}
.pasos li b{color:var(--ink)}.pasos li .tt{color:var(--ink);display:block;font-size:15px;font-weight:700}.pasos li.on{border-color:var(--acc);background:var(--soft)}.pasos li.on:before,.pasos li.ok:before{background:var(--acc);color:var(--accx)}.pasos li.ok:before{content:"✓";background:var(--ok)}
.nav2{display:flex;gap:8px;margin-top:10px}.nav2 button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;cursor:pointer}.nav2 button.p{background:var(--acc);color:var(--accx);border-color:var(--acc)}
/* browser chrome */
.bar{height:46px;background:#202124;display:flex;align-items:center;gap:8px;padding:0 10px;color:#e8eaed;font-size:13px}.bar .url{flex:1;background:#303134;border-radius:99px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .dots{font-size:18px;padding:0 4px}
.bar.ios{background:#f2f2f7;color:#111}.bar.ios .url{background:#e3e3e8;text-align:center}
.ios-bottom{position:absolute;left:0;right:0;bottom:0;height:48px;background:#f2f2f7;display:flex;justify-content:space-around;align-items:center;font-size:20px;color:#007aff}
.app{padding:14px}.logo{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 60%,#2a1206 62%);margin:18px auto 10px}
.login h3{font:700 26px Fraunces,serif;text-align:center;margin:0}.login p{text-align:center;color:var(--mut);margin:2px 0 16px;font-size:13.5px}
.f{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);margin-bottom:8px;font-size:14px}.f small{display:block;font-size:11.5px}
.b{display:block;width:100%;padding:12px;border-radius:12px;border:0;font:700 14.5px inherit;text-align:center;margin-top:8px;cursor:pointer}.b.p{background:var(--acc);color:var(--accx)}.b.o{background:var(--card2);color:var(--ink);border:1px solid var(--acc)}
.pulse{animation:pu 1.2s infinite}@keyframes pu{0%,100%{box-shadow:0 0 0 0 #f7a82399}50%{box-shadow:0 0 0 8px #f7a82300}}
.dlg{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.dlg .c{background:#fff;color:#202124;width:100%;border-radius:18px 18px 0 0;padding:18px}
.dlg .c.mid{width:86%;border-radius:18px;margin-bottom:auto;margin-top:auto}
.dlg h4{margin:0 0 6px;font-size:17px}.dlg p{margin:0 0 14px;color:#5f6368;font-size:14px}.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.dlg .row button{padding:9px 16px;border-radius:99px;border:0;font:600 14px inherit;cursor:pointer;background:none;color:#1a73e8}.dlg .row button.p{background:#1a73e8;color:#fff}
.mini{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mini .ic{width:42px;height:42px;border-radius:12px;background:#16120e;display:grid;place-items:center}.mini .ic i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 70%)}
.home{position:absolute;inset:0;background:linear-gradient(160deg,#2b4a6b,#1c2a3a 60%,#16202b);padding:46px 22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}.ap{text-align:center;font-size:11px;color:#fff}.ap .ic{width:54px;height:54px;border-radius:15px;margin:0 auto 5px;display:grid;place-items:center;font-size:26px;background:#ffffff26}
.ap.med .ic{background:#16120e}.ap.med .ic i{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 70%)}
.ap.new .ic{outline:3px solid var(--acc);outline-offset:3px;animation:pu 1.2s infinite}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.top .lg{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 60%,#2a1206 62%)}.top b{font:700 21px Fraunces,serif;flex:1}
.inst{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#3a2410,#211b15);border:1px solid var(--acc);border-radius:14px;padding:9px 10px;margin-bottom:10px;font-size:12.5px}.inst .t{flex:1}.inst .t b{display:block;font-size:13.5px}.inst button{font:700 12.5px inherit;padding:8px 10px;border-radius:10px;border:0;background:var(--acc);color:var(--accx);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13px}.card b{font:700 15px Fraunces,serif}
.noti{position:absolute;left:10px;right:10px;top:10px;background:#fffffff2;color:#202124;border-radius:16px;padding:10px 12px;display:flex;gap:10px;z-index:6;box-shadow:0 8px 24px #0006;animation:baja .5s ease}
@keyframes baja{from{transform:translateY(-120%)}to{transform:none}}.noti .ic{width:34px;height:34px;border-radius:9px;background:#16120e;display:grid;place-items:center;flex:none}.noti .ic i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 70%)}.noti small{color:#5f6368;font-size:11.5px}.noti b{display:block;font-size:13.5px}.noti span{font-size:13px}
.st{position:absolute;top:0;left:0;right:0;height:24px;display:flex;justify-content:space-between;padding:4px 16px;font-size:11.5px;color:#fff;z-index:4}.st .ni{display:flex;gap:5px;align-items:center}.st .ni i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 70%);display:inline-block}
.hint{position:absolute;left:12px;right:12px;bottom:14px;background:#000c;color:#fff;border-radius:12px;padding:8px 11px;font-size:12.5px;z-index:7;text-align:center}
</style></head><body>
<div class="intro"><h1>Cómo instalar la app de Médicos</h1><p>Así lo ve alguien que todavía no la tiene instalada ni tiene los avisos. Tocá los botones naranjas del celular, o los pasos de la derecha. Es solo una guía: no instala nada.</p><p style="margin-top:10px"><a href="./" style="display:inline-block;background:#f7a823;color:#281a08;font-weight:700;padding:10px 16px;border-radius:12px;text-decoration:none">Abrir la app de Médicos →</a></p></div>
<div class="sel"><button data-os="android" class="on">🤖 Android</button><button data-os="ios">🍎 iPhone</button></div>
<div class="wrap">
 <div class="phone"><div class="scr" id="scr"></div></div>
 <div class="pasos"><h2 id="tit">Paso a paso</h2><ol id="lista"></ol>
  <div class="nav2"><button id="ant">‹ Anterior</button><button class="p" id="sig">Siguiente ›</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let os="android",i=0;
const URL="reboirasnicolas4-dev.github.io/turnos-m4p8";
const bar=()=>os==="ios"?`<div class="bar ios"><span>Aa</span><div class="url">🔒 ${URL}</div><span>↻</span></div>`:`<div class="bar"><span>⌂</span><div class="url">🔒 ${URL}</div><span class="dots">⋮</span></div>`;
const iosBottom=()=>os==="ios"?`<div class="ios-bottom"><span>‹</span><span>›</span><span id="share" style="padding:4px 10px;border-radius:8px">⬆︎</span><span>📖</span><span>⧉</span></div>`:"";
const login=(extra)=>`${bar()}<div class="app login"><div class="logo"></div><h3>Médicos</h3><p>Alas de Libertad · turnos y viáticos</p>
 <div class="f"><small>Correo electrónico</small>nombre@correo.com</div><div class="f"><small>Contraseña</small>••••••••</div>
 <div class="f" style="background:none;border:0;padding:4px 2px">☐ Recordarme en este dispositivo (30 días)</div>
 <button class="b p" data-go="${os==="ios"?6:5}">Ingresar</button><button class="b o pulse" data-go="1">📲 Instalar la app en este aparato</button>
 <p style="font-size:12px;margin-top:12px">Es el mismo usuario y contraseña de la app de Internos.</p></div>${iosBottom()}${extra||""}`;
const home=(extra)=>`<div class="home"><div class="st"><span>10:45</span><span>📶 🔋</span></div><div class="grid">
 ${[["📞","Teléfono"],["💬","WhatsApp"],["📷","Cámara"],["🌐","Chrome"],["📅","Calendario"],["🖼️","Galería"],["⚙️","Ajustes"]].map(([e,n])=>`<div class="ap"><div class="ic">${e}</div>${n}</div>`).join("")}
 <div class="ap med new" data-go="4" style="cursor:pointer"><div class="ic"><i></i></div>Médicos</div></div>${extra||""}</div>`;
const appHoy=(av,noti)=>`<div style="padding:14px">${noti?`<div style="height:0"></div>`:""}<div class="top"><span class="lg"></span><b>Médicos</b><span style="font-size:13px;color:var(--mut)">🔔 ⟳</span></div>
 ${av?`<div class="inst"><div style="font-size:22px">🔔</div><div class="t"><b>Activá los avisos de médicos</b>Te llegan 5 y 3 días antes.</div><button class="pulse" data-go="${av}">Activar</button></div>`:""}
 <div class="card"><b>📋 Para hacer hoy</b><div style="margin-top:6px">💸 <b style="font:600 13px inherit;color:#ff8f7a">Pedir la plata</b> a la familia de Juan ($700). Médico en 3 días.</div></div>
 <div class="card" style="border-color:var(--acc)"><small style="color:var(--acc);font-weight:700;font-size:11px">PRÓXIMO MÉDICO · EN 3 DÍAS 10:42</small><br><b>Juan Pérez</b><div style="color:var(--mut)">📍 Montevideo · Control</div></div></div>`;
const P={
 android:[
  ["Abre el link que le pasaste","Lo abre en Chrome. Ve la pantalla para entrar y, abajo, el botón <b>📲 Instalar la app</b>.",()=>login()],
  ["Toca \"Instalar la app\"","El celular muestra su propia ventanita: <b>¿Instalar la app?</b> Toca <b>Instalar</b>.",()=>login(`<div class="dlg"><div class="c"><div class="mini"><div class="ic"><i></i></div><div><b>Instalar app</b><br><span style="color:#5f6368;font-size:13px">Médicos · reboirasnicolas4-dev.github.io</span></div></div><div class="row"><button data-go="0">Cancelar</button><button class="p" data-go="2">Instalar</button></div></div></div>`)],
  ["Se instala sola","En unos segundos aparece el ícono naranja de <b>Médicos</b> en la pantalla del celular, como cualquier app.",()=>home(`<div class="hint">✅ Médicos se agregó a la pantalla principal</div>`)],
  ["La abre desde el ícono","Toca el ícono <b>Médicos</b>. Se abre en pantalla completa, sin la barra de Chrome.",()=>home()],
  ["Entra con su usuario de Internos","Pone su correo y contraseña. El cartel de instalar ya no aparece porque la app está instalada.",()=>`<div class="app login" style="padding-top:30px"><div class="logo"></div><h3>Médicos</h3><p>Alas de Libertad · turnos y viáticos</p><div class="f"><small>Correo electrónico</small>juan@gmail.com</div><div class="f"><small>Contraseña</small>••••••••</div><div class="f" style="background:none;border:0;padding:4px 2px">☑ Recordarme en este dispositivo (30 días)</div><button class="b p pulse" data-go="5">Ingresar</button></div>`],
  ["Le aparece \"Activá los avisos\"","Arriba en Hoy ve el cartel <b>🔔 Activá los avisos de médicos</b>. Toca <b>Activar</b>.",()=>appHoy(6)],
  ["El celular pide permiso","Sale la pregunta del celular: <b>¿Permitir que Médicos te envíe notificaciones?</b> Toca <b>Permitir</b>.",()=>appHoy(6)+`<div class="dlg"><div class="c mid"><div style="text-align:center;font-size:26px">🔔</div><h4 style="text-align:center">¿Permitir que Médicos te envíe notificaciones?</h4><div class="row" style="justify-content:center;margin-top:12px"><button data-go="5">No permitir</button><button class="p" data-go="7">Permitir</button></div></div></div>`],
  ["¡Listo! Le llega el aviso de prueba","Le llega <b>🔔 Avisos activados</b> con el ícono naranja, y el cartel desaparece. Desde ahora le llegan los avisos de los médicos.",()=>`<div class="st" style="color:var(--ink)"><span>10:46</span><span class="ni"><i></i> 📶 🔋</span></div><div style="height:22px"></div>`+appHoy(0)+`<div class="noti"><div class="ic"><i></i></div><div><small>Médicos · ahora</small><b>🔔 Avisos activados</b><span>Así te van a llegar los avisos de los médicos.</span></div></div>`]],
 ios:[
  ["Abre el link en Safari","En iPhone tiene que ser <b>Safari</b>. Ve la pantalla para entrar y el botón <b>📲 Instalar la app</b>.",()=>login()],
  ["Toca \"Instalar la app\"","Apple no deja instalar con un botón, así que la app le muestra los 3 pasos a seguir.",()=>login(`<div class="dlg"><div class="c" style="background:var(--card);color:var(--ink)"><h4 style="font:700 19px Fraunces,serif">📲 Instalar la app</h4><p style="color:var(--mut)">En iPhone se instala desde Safari:</p><p style="color:var(--ink)">1. Tocá <b>Compartir</b> (el cuadrado con la flecha ⬆︎).<br>2. Elegí <b>"Agregar a inicio"</b>.<br>3. Tocá <b>Agregar</b>.</p><button class="b p" data-go="2">Entendido</button></div></div>`)],
  ["Toca Compartir ⬆︎ y \"Agregar a inicio\"","Abajo en Safari toca el botón <b>Compartir</b>, baja un poco y elige <b>Agregar a inicio</b>.",()=>login(`<div class="dlg"><div class="c" style="background:#f2f2f7"><div style="background:#fff;border-radius:12px">${["Copiar","Agregar a lista de lectura","Agregar a favoritos"].map(x=>`<div style="padding:11px 14px;border-bottom:1px solid #e5e5ea">${x}</div>`).join("")}<div class="pulse" data-go="3" style="padding:11px 14px;cursor:pointer;font-weight:600;background:#fff6e5;border-radius:0 0 12px 12px">⊞ Agregar a inicio</div></div></div></div>`)],
  ["Toca \"Agregar\"","Le muestra el ícono y el nombre <b>Médicos</b>. Toca <b>Agregar</b>, arriba a la derecha.",()=>login(`<div class="dlg"><div class="c" style="background:#f2f2f7;height:70%"><div style="display:flex;justify-content:space-between;color:#007aff;margin-bottom:14px"><span>Cancelar</span><b style="color:#111">Agregar a inicio</b><span class="pulse" data-go="4" style="cursor:pointer;font-weight:700;padding:2px 6px;border-radius:6px">Agregar</span></div><div style="background:#fff;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center"><div class="mini" style="margin:0"><div class="ic"><i></i></div></div><div>Médicos<br><small style="color:#8e8e93">${URL}</small></div></div></div></div>`)],
  ["La abre desde el ícono","Aparece el ícono naranja <b>Médicos</b> en la pantalla. La abre desde ahí (no desde Safari).",()=>home()],
  ["Entra con su usuario de Internos","Pone su correo y contraseña, igual que en Internos.",()=>`<div class="app login" style="padding-top:30px"><div class="logo"></div><h3>Médicos</h3><p>Alas de Libertad · turnos y viáticos</p><div class="f"><small>Correo electrónico</small>juan@gmail.com</div><div class="f"><small>Contraseña</small>••••••••</div><button class="b p pulse" data-go="6">Ingresar</button></div>`],
  ["Activa los avisos","Ve el cartel <b>🔔 Activá los avisos</b>, toca <b>Activar</b> y después <b>Permitir</b>.",()=>appHoy(7)+`<div class="dlg"><div class="c mid"><h4 style="text-align:center">"Médicos" quiere enviarte notificaciones</h4><div class="row" style="justify-content:center;margin-top:12px"><button>No permitir</button><button class="p" data-go="7">Permitir</button></div></div></div>`],
  ["¡Listo!","Le llega <b>🔔 Avisos activados</b>. En iPhone los avisos solo funcionan si la app se abre desde el ícono de inicio.",()=>`<div style="height:22px"></div>`+appHoy(0)+`<div class="noti"><div class="ic"><i></i></div><div><small>Médicos · ahora</small><b>🔔 Avisos activados</b><span>Así te van a llegar los avisos de los médicos.</span></div></div>`]]
};
function dibujar(){const L=P[os];i=Math.max(0,Math.min(i,L.length-1));
 $("scr").innerHTML=L[i][2]();
 $("lista").innerHTML=L.map((p,k)=>`<li data-k="${k}" class="${k===i?"on":k<i?"ok":""}"><span class="tt">${p[0]}</span>${p[1]}</li>`).join("");
 $("ant").disabled=i===0;$("sig").textContent=i===L.length-1?"Volver a empezar ↺":"Siguiente ›"}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){i=+g.dataset.go;dibujar();return}
 const li=e.target.closest("#lista li");if(li){i=+li.dataset.k;dibujar();return}
 const o=e.target.closest("[data-os]");if(o){os=o.dataset.os;i=0;document.querySelectorAll("[data-os]").forEach(b=>b.classList.toggle("on",b===o));dibujar()}});
$("ant").onclick=()=>{i--;dibujar()};$("sig").onclick=()=>{i=i===P[os].length-1?0:i+1;dibujar()};
dibujar();
</script></body></html>
