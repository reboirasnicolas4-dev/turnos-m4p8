<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Médicos · Alas de Libertad</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#16120e;--card:#211b15;--card2:#2b241d;--line:#3a3027;--ink:#f0e8da;--mut:#b3a99b;--acc:#f7a823;--accx:#281a08;--soft:#3a2a12;--ok:#8fd19e;--blue:#8db4ff;--red:#ff8f7a}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Hanken Grotesk",system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;padding:16px 14px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 60% 40%,#ffb43a,#e2531c 60%,#2a1206 62%);flex:none}
.top h1{font:700 26px Fraunces,serif;margin:0;line-height:1}.top small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.res button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.res b{font:700 22px Fraunces,serif;display:block}.res span{font-size:12px;color:var(--mut)}
.res button.w{border-color:var(--acc)}.res button.w b{color:var(--acc)}.res button.on{background:var(--soft);border-color:var(--acc)}
.alerta{background:var(--soft);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.alerta b{color:var(--acc)}
.nota{border:1px dashed var(--line);border-radius:12px;padding:9px 12px;color:var(--mut);font-size:13.5px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 14.5px inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.srch input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none;padding:11px 0}
.filtro{display:flex;align-items:center;justify-content:space-between;color:var(--acc);font-size:13.5px;margin:-4px 2px 10px}
.filtro button{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);margin:14px 2px 6px;text-transform:uppercase}
.t{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;cursor:pointer;align-items:center}
.t.urg{border-color:var(--acc);background:linear-gradient(90deg,#2e2214,var(--card) 60%)}
.t.viejo{border-style:dashed}
.d{width:52px;flex:none;text-align:center;background:var(--card2);border-radius:12px;padding:6px 0}
.d small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.d b{font:700 22px Fraunces,serif;display:block;line-height:1.1}
.t .i{flex:1;min-width:0}.t .n{font-weight:700;font-size:16px}.t .s{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.chip.sin{color:var(--acc);border-color:#6a4a16}.chip.pedido{color:var(--blue);border-color:#33405a}.chip.recibido{color:var(--ok);border-color:#2f4a35}
.chip.hoy{background:var(--acc);color:var(--accx);border-color:var(--acc);font-weight:700}.chip.pron{color:var(--ink)}
.chip.fue{color:var(--ok)}.chip.nofue{color:var(--red)}
.vacio{text-align:center;color:var(--mut);padding:30px 10px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(532px,calc(100% - 28px));padding:15px;border-radius:16px;border:0;background:var(--acc);color:var(--accx);font:700 16px inherit;cursor:pointer;box-shadow:0 10px 30px #0009;z-index:3}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}.sheet.on{display:flex}
.sh{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 16px 26px;border-top:1px solid var(--line)}
.sh h2{margin:0 0 2px;font:700 22px Fraunces,serif}.sh .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin:14px 0 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.f input,.f textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;padding:11px 12px;outline:none;color-scheme:dark}
.f input:focus,.f textarea:focus{border-color:var(--acc)}.f textarea{min-height:70px;resize:vertical}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns.c3{grid-template-columns:repeat(3,1fr)}
.b{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 8px;font:600 14px inherit;cursor:pointer;text-align:center;text-decoration:none;display:block}
.b.p{background:var(--acc);color:var(--accx);border-color:var(--acc)}.b.sel{outline:2px solid var(--acc);background:var(--soft)}
.b.full{grid-column:1/-1}.b.red{color:var(--red)}
.info{background:var(--card2);border-radius:14px;padding:4px 12px}.info div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.info div:last-child{border:0}
.info i{font-style:normal;width:22px;flex:none}.info span{color:var(--mut);width:88px;flex:none}
.msg{background:#122016;border:1px solid #2f4a35;border-radius:14px;padding:12px;font-size:14.5px;white-space:pre-wrap;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#f0e8da;color:#1b140d;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;display:none;max-width:90%}
.ic{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--mut);padding:8px 11px;font:600 14px inherit;cursor:pointer}
.login{max-width:380px;margin:0 auto;padding:60px 18px;text-align:center}.login h1{font:700 30px Fraunces,serif;margin:0}.login>p{color:var(--mut);margin:4px 0 24px}
.login form{text-align:left}.lerr{color:var(--red);min-height:20px;font-size:14px;margin:2px 0 10px}.lnota{color:var(--mut);font-size:13px;margin-top:14px}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.dia{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0;color:var(--ink);font:inherit}
.dia small{font-size:10.5px;color:var(--mut);text-transform:uppercase}.dia b{font:700 18px Fraunces,serif}
.dia i{display:block;width:6px;height:6px;border-radius:50%;margin-top:3px}.dia.t i{background:var(--acc)}.dia.hoy{border-color:var(--acc)}
.dia.sel{background:var(--acc);color:var(--accx)}.dia.sel small{color:var(--accx)}.dia.sel i{background:var(--accx)}
.hero{background:linear-gradient(135deg,#3a2410,#211b15);border:1px solid var(--acc);border-radius:18px;padding:13px 14px;margin-bottom:12px;cursor:pointer}
.hero small{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.hero h4{margin:3px 0 2px;font:700 20px Fraunces,serif}.hero p{margin:0;color:#e4dacb;font-size:14px}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chk button{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:99px;background:#0006;border:1px solid var(--line);color:var(--mut);cursor:pointer}.chk button.ok{border-color:var(--ok);color:var(--ok)}
.chip.rep{color:#d4b5e8;border-color:#4a3a55}
.mesh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.mesh h2{flex:1;margin:0;font:700 22px Fraunces,serif;text-align:center}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:12px}
.mes .h{color:var(--mut);font-size:10.5px;text-align:center;text-transform:uppercase;padding:2px 0}
.mes button{aspect-ratio:1;border-radius:9px;background:var(--card);border:1px solid transparent;color:var(--ink);font:inherit;font-size:13px;position:relative;cursor:pointer;padding:0}
.mes button.v{visibility:hidden}.mes button.hoy{border-color:var(--acc)}.mes button.sel{background:var(--acc);color:var(--accx)}
.mes button[data-n]:after{content:attr(data-n);position:absolute;bottom:2px;right:3px;font-size:9.5px;background:var(--acc);color:var(--accx);border-radius:99px;padding:0 4px;font-weight:700;line-height:14px}
.mes button.sel[data-n]:after{background:var(--accx);color:var(--acc)}
.ficha{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ficha h3{margin:0;font:700 20px Fraunces,serif}.ficha p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 2px}.kpi div{background:var(--card2);border-radius:11px;padding:7px 8px}.kpi b{font:700 18px Fraunces,serif;display:block}.kpi span{font-size:11.5px;color:var(--mut)}
.hist{border-left:2px solid var(--line);margin:6px 0 0 8px;padding-left:12px}.hist div{position:relative;margin-bottom:10px;font-size:13.5px;cursor:pointer}.hist div:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.hist div.f:before{border-color:var(--ok)}.hist div.nf:before{border-color:var(--red)}.hist div.p:before{border-color:var(--acc);background:var(--acc)}.hist small{color:var(--mut);display:block;white-space:pre-wrap}
.cuenta{display:grid;grid-template-columns:1fr auto;gap:3px 10px;background:var(--card2);border-radius:12px;padding:9px 11px;font-size:13.5px;margin-top:8px}.cuenta b{text-align:right}.cuenta .r{cursor:pointer}.cuenta .tot{border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.prox{margin-top:12px;background:var(--soft);border:1px solid var(--acc);border-radius:14px;padding:11px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#120f0c;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 6px 10px;z-index:4}
.nav button{flex:1;max-width:140px;background:none;border:0;color:var(--mut);font:600 11px inherit;cursor:pointer;text-align:center}.nav button i{display:block;font-style:normal;font-size:19px;line-height:28px;width:50px;margin:0 auto 2px;border-radius:99px}.nav button.on{color:var(--ink)}.nav button.on i{background:#3a2c18}
.app{padding-bottom:170px}.fab{bottom:78px}.toast{bottom:150px}
</style>

<div class="app">
 <div class="top"><div class="logo"></div><div style="flex:1"><h1>Médicos</h1><small>Alas de Libertad · turnos y viáticos</small></div><button class="ic" data-act="avisos" title="Avisos">🔔</button><button class="ic" data-act="recargar" title="Actualizar">⟳</button><button class="ic" data-act="salir" title="Salir">Salir</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const VIA={sin:"💸 Falta pedir",pedido:"⏳ Pedido a la familia",recibido:"✅ Plata recibida",no:"No precisa"};
const S={list:[],tab:"prox",filtro:null,q:"",internos:[],rol:"",vista:"hoy",dia:null,mes:null,calDia:null,intSel:null,prox:null};
// ⬇⬇ PEGÁ ACÁ ENTRE LAS COMILLAS LA URL DE TU APPS SCRIPT (termina en /exec) ⬇⬇
const API="https://script.google.com/macros/s/AKfycbzYithfRv1aTYL1CrPeYHpAcq7XccGY3Gm7Bvlb56aCn65ZlT-FS7a6ePZ7-OumAz5LRw/exec";
const esta=n=>!S.internos.length||S.internos.some(x=>x.toLowerCase()===(n||"").toLowerCase());
let cred=null,cargando=false;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};

function hoy0(){const d=new Date();d.setHours(0,0,0,0);return d}
function pf(f){const [y,m,d]=(f||"").split("-").map(Number);return y?new Date(y,m-1,d):null}
function dias(f){const d=pf(f);return d?Math.round((d-hoy0())/864e5):999}
function rel(n){return n===0?"Hoy":n===1?"Mañana":n>1&&n<7?`En ${n} días`:n<0?"Ya pasó":""}
function fLarga(t){const d=pf(t.fecha);if(!d)return"";return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`}
function plata(m){return m?"$ "+Number(m).toLocaleString("es-UY"):""}
function urg(t){return t.estado==="pendiente"&&t.viatico==="sin"&&dias(t.fecha)>=0&&dias(t.fecha)<=3}
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function nota(m){const e=$("nota");if(m){e.textContent=m;e.hidden=false}else e.hidden=true}

const LLEVA=["Cédula","Carné de salud","Estudios","Receta","Plata del viático"];
const DCORTO=["dom","lun","mar","mié","jue","vie","sáb"];
function partes(t){let rep="",lleva=[],libre=[];for(const l of String(t.notas||"").split("\n")){let m;
 if(m=l.match(/^🔁 Se repite: (.+)$/))rep=m[1].trim();else if(m=l.match(/^Lleva: ?(.*)$/))lleva=m[1].split(",").map(x=>x.trim()).filter(Boolean);else libre.push(l)}
 return {rep,lleva,libre:libre.join("\n").trim()}}
function armar(p){return [p.rep?"🔁 Se repite: "+p.rep:"",p.lleva&&p.lleva.length?"Lleva: "+p.lleva.join(", "):"",p.libre||""].filter(Boolean).join("\n")}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function sumar(f,rep,k){const d=pf(f);if(rep==="cada semana")d.setDate(d.getDate()+7*k);else if(rep==="cada 15 días")d.setDate(d.getDate()+14*k);
 else{const dia=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+k);const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(dia,ult))}return iso(d)}
const ord=(a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora);
function tarjeta(t,conDia){const n=dias(t.fecha),d=pf(t.fecha),p=partes(t);
 return `<div class="t${urg(t)?" urg":""}${t.estado==="pendiente"&&n<0?" viejo":""}" data-id="${esc(t.id)}">
    <div class="d"><small>${d?DIAS[d.getDay()].slice(0,3):""}</small><b>${d?d.getDate():"?"}</b><small>${d?MES[d.getMonth()]:""}</small></div>
    <div class="i"><div class="n">${esc(t.interno)}</div><div class="s">🕒 ${esc(t.hora||"--:--")} · 📍 ${esc(t.lugar||"sin lugar")}${t.especialidad?" · "+esc(t.especialidad):""}</div>
    <div class="chips">${t.estado==="pendiente"&&n>=0&&n<=1?`<span class="chip hoy">${rel(n)}</span>`:t.estado==="pendiente"&&n>1&&n<7?`<span class="chip pron">${rel(n)}</span>`:""}
     ${t.estado==="pendiente"&&!esta(t.interno)?'<span class="chip nofue">Ya no está en la comunidad</span>':""}
     ${t.estado==="fue"?'<span class="chip fue">✔ Fue</span>':t.estado==="nofue"?'<span class="chip nofue">✖ No fue</span>':""}
     ${t.viatico!=="no"?`<span class="chip ${t.viatico}">${VIA[t.viatico]||""}${t.monto?" · "+plata(t.monto):""}</span>`:""}
     ${p.rep?`<span class="chip rep">🔁 ${esc(p.rep)}</span>`:""}</div></div></div>`}
function render(){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.vista));
 $("v-hoy").hidden=S.vista!=="hoy";$("v-otra").hidden=S.vista==="hoy";
 if(cred)$("nuevo").hidden=S.vista==="plata";
 if(S.vista==="hoy")vHoy();else $("v-otra").innerHTML={cal:vCal,int:vInt,plata:vPlata}[S.vista]();
 const ints=[...new Set([...S.internos,...S.list.map(t=>t.interno)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es")),lugs=[...new Set(["Ciudad del Plata","San José de Mayo","Montevideo","Libertad",...S.list.map(t=>t.lugar).filter(Boolean)])];
 $("dl-int").innerHTML=ints.map(x=>`<option value="${esc(x)}">`).join("");$("dl-lug").innerHTML=lugs.map(x=>`<option value="${esc(x)}">`).join("");
}
function vHoy(){
 const pend=S.list.filter(t=>t.estado==="pendiente");
 const h=hoy0();
 $("semana").innerHTML=[0,1,2,3,4,5,6].map(i=>{const d=new Date(h);d.setDate(d.getDate()+i);const hay=pend.some(t=>dias(t.fecha)===i);
  return `<button class="dia${i===0?" hoy":""}${hay?" t":""}${S.dia===i?" sel":""}" data-dia="${i}"><small>${DCORTO[d.getDay()]}</small><b>${d.getDate()}</b><i></i></button>`}).join("");
 const prox=pend.filter(t=>dias(t.fecha)>=0).sort(ord)[0];
 if(prox){const p=partes(prox),n=dias(prox.fecha);
  $("hero").innerHTML=`<div class="hero" data-id="${esc(prox.id)}"><small>Próximo médico · ${rel(n)||fLarga(prox)}${prox.hora?" "+esc(prox.hora):""}</small><h4>${esc(prox.interno)}</h4>
  <p>📍 ${esc(prox.lugar||"sin lugar")}${prox.especialidad?" · "+esc(prox.especialidad):""}${prox.acompana?" · lo lleva "+esc(prox.acompana):""}</p>

async function api(accion,extra){
 if(!API||API.indexOf("http")!==0)throw new Error("Falta poner la URL del Apps Script en el archivo.");
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({accion,correo:cred&&cred.correo,clave:cred&&cred.clave},extra||{}))});
 return r.json()}
async function cargar(silencioso){
 if(!cred||cargando)return;cargando=true;
 try{const r=await api("listar");
  if(!r.ok){if(/contraseña|acceso/i.test(r.error||"")){salir();$("lerr").textContent=r.error}else nota(r.error);return}
  S.list=r.turnos||[];S.rol=r.rol;if(Array.isArray(r.internos)){S.internos=r.internos;ls.set("med_int",r.internos)}
  nota("");render();
  const id=$("sh").dataset.id;if($("sheet").classList.contains("on")&&id&&!document.getElementById("fm")){if(get(id))detalle(id);else cerrar()}
 }catch(e){if(!silencioso)nota("No se pudo conectar. Revisá internet y tocá ⟳ para reintentar.")}
 finally{cargando=false}}
async function guardar(id,body){
 const btn=document.querySelector("#fm button[type=submit]");if(btn){btn.disabled=true;btn.textContent="Guardando…"}
 try{const r=await api("guardar",{turno:Object.assign({},body,{id:id||""})});
  if(!r.ok){toast(r.error||"No se pudo guardar");return null}
  const o=Object.assign({},body,{id:r.id});const k=S.list.findIndex(x=>x.id===r.id);k<0?S.list.push(o):S.list[k]=o;render();cargar(true);return r.id}
 catch(e){toast("No se pudo guardar. Revisá internet.");return null}
 finally{if(btn){btn.disabled=false;btn.textContent="Guardar"}}}
async function cambiar(id,campos,sinDetalle){const t=get(id);if(!t)return;
 const prev=Object.assign({},t);Object.assign(t,campos);render();if(!sinDetalle)detalle(id);
 const ok=await guardar(id,t);if(!ok){Object.assign(t,prev);render();if(!sinDetalle)detalle(id)}}
async function borrar(id){
 try{const r=await api("borrar",{id});if(!r.ok){toast(r.error||"No se pudo borrar");return}
  S.list=S.list.filter(t=>t.id!==id);render();cerrar();toast("Turno borrado")}catch(e){toast("No se pudo borrar. Revisá internet.")}}

/* ---------- Entrar / salir ---------- */
function pantallaLogin(on){$("login").hidden=!on;document.querySelector(".app").hidden=on;$("nuevo").hidden=on;$("nav").hidden=on}
function salir(){cred=null;ls.del("med_cred");S.list=[];pantallaLogin(true)}
$("lform").addEventListener("submit",async ev=>{ev.preventDefault();
 const correo=$("lcorreo").value.trim().toLowerCase(),clave=$("lclave").value;$("lerr").textContent="";
 if(!correo||!clave){$("lerr").textContent="Poné tu correo y tu contraseña.";return}
 const b=$("lbtn");b.disabled=true;b.textContent="Entrando…";
 try{cred={correo,clave};const r=await api("login");
  if(!r.ok){cred=null;$("lerr").textContent=r.error;return}
  ls.set("med_cred",cred);S.rol=r.rol;pantallaLogin(false);if(r.primeraVez)toast("Listo, esa es tu contraseña desde ahora");cargar()}
 catch(e){cred=null;$("lerr").textContent=e.message.indexOf("URL")>=0?e.message:"No se pudo conectar. Revisá internet."}
 finally{b.disabled=false;b.textContent="Entrar"}});

document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-lleva],[data-v],[data-dia],[data-cdia],[data-mes],[data-int],[data-tab],[data-f],#qf,[data-id],#nuevo,[data-act],[data-via],[data-est]");if(el&&el.closest("#login"))return;if(!el)return;
 if(el.closest("#fm")&&!el.dataset.act)return;
 if(el.dataset.lleva){toggleLleva(el.dataset.tid,el.dataset.lleva,$("sheet").classList.contains("on"));return}
 if(el.dataset.v){S.vista=el.dataset.v;S.dia=null;if(el.dataset.v!=="int")S.intSel=null;cerrar();render();window.scrollTo(0,0);return}
 if(el.dataset.dia!==undefined){const d=+el.dataset.dia;S.dia=S.dia===d?null:d;S.tab="prox";render();return}
 if(el.dataset.cdia){S.calDia=S.calDia===el.dataset.cdia?null:el.dataset.cdia;render();return}
 if(el.dataset.mes){const m=S.mes;S.mes=new Date(m.getFullYear(),m.getMonth()+(+el.dataset.mes),1);S.calDia=null;render();return}
 if(el.dataset.int!==undefined){S.intSel=el.dataset.int||null;render();window.scrollTo(0,0);return}
 if(el.dataset.tab){S.tab=el.dataset.tab;S.filtro=null;render();return}
 if(el.dataset.f){S.tab="prox";S.filtro=S.filtro===el.dataset.f?null:el.dataset.f;render();return}
 if(el.id==="qf"){S.filtro=null;S.dia=null;render();return}
 if(el.id==="nuevo"){form();return}
 if(el.dataset.id){S.prox=null;detalle(el.dataset.id);return}
 const id=$("sh").dataset.id;
 if(el.dataset.via){cambiar(id,{viatico:el.dataset.via});return}
 if(el.dataset.est){S.prox=el.dataset.est==="fue"?id:null;cambiar(id,{estado:el.dataset.est});return}
 const a=el.dataset.act;
 if(a==="cerrar")cerrar();
 else if(a==="volver")detalle(id);
 else if(a==="editar")form(get(id));
 else if(a==="borrar"){el.outerHTML=`<button class="b red" data-act="borrarsi">¿Seguro? Tocá para borrar</button>`}
 else if(a==="borrarsi")borrar(id);
 else if(a==="salir")salir();
 else if(a==="recargar"){toast("Actualizando…");cargar()}
 else if(a==="avisos")panelAvisos();
 else if(a==="noprox"){S.prox=null;detalle(id)}
 else if(a==="siprox")guardarProx(id);
 else if(a==="verint"){const t=get(id);cerrar();S.vista="int";S.intSel=t?t.interno:null;render();window.scrollTo(0,0)}
 else if(a==="activar")activarAvisos();
 else if(a==="probar")probarAviso();
 else if(a==="apagar")apagarAvisos();
});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")cerrar()});
$("q").addEventListener("input",e=>{S.q=e.target.value;render()});

render();
S.internos=ls.get("med_int")||[];
cred=ls.get("med_cred");
if(cred){pantallaLogin(false);cargar()}else pantallaLogin(true);
setInterval(()=>{if(cred&&document.visibilityState==="visible"&&!$("sheet").classList.contains("on"))cargar(true)},60000);
document.addEventListener("visibilitychange",()=>{if(cred&&document.visibilityState==="visible")cargar(true)});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

/* ---------- Avisos al celular ---------- */
const FB={apiKey:"AIzaSyB5DB0Z8_6UGLkHIs3m5UiflNDXdDp1IpQ",authDomain:"medicos-alas.firebaseapp.com",projectId:"medicos-alas",storageBucket:"medicos-alas.firebasestorage.app",messagingSenderId:"710012164824",appId:"1:710012164824:web:a1d4a678d3f05977a455ad"};
const VAPID="BCSCzAuzajEaBOoy7eIMcqXlkkq9nIzXp0W12nWq9d_4_UrsNQqHBYjaKjU6-xXvs5s_--AuIsW-XMeX4Sqo8E8";
function fbMsg(){if(!window.firebase)return null;if(!firebase.apps.length)firebase.initializeApp(FB);return firebase.messaging()}
const avisosPosibles=()=>("Notification" in window)&&("serviceWorker" in navigator)&&("PushManager" in window)&&!!window.firebase;
function panelAvisos(){
 const on=!!ls.get("med_tok")&&avisosPosibles()&&Notification.permission==="granted";
 const ios=/iPhone|iPad/i.test(navigator.userAgent)&&!window.navigator.standalone;
 abrir(`<h2>🔔 Avisos de médicos</h2><p class="sub">Te llega un aviso al celular, con el ícono de la app:</p>
 <div class="info"><div><i>5️⃣</i><span>5 días antes</span>un aviso a las 7 de la mañana</div><div><i>3️⃣</i><span>Desde 3 días antes</span>todos los días a las 7 y a las 17, hasta el día del médico</div></div>
 <div class="lbl">En este aparato</div>
 ${!avisosPosibles()?`<div class="nota">${ios?"En iPhone primero tenés que agregar la app a la pantalla de inicio (botón Compartir → Agregar a inicio) y abrirla desde ese ícono.":"Este navegador no permite avisos. Probá con Chrome."}</div>`:
  on?`<div class="nota" style="border-color:var(--ok);color:var(--ok)">✅ Los avisos están activados en este aparato.</div><div class="btns"><button class="b" data-act="probar">Mandar aviso de prueba</button><button class="b" data-act="apagar">Apagar avisos</button></div>`:
  `<button class="b p full" data-act="activar" style="width:100%">🔔 Activar avisos en este aparato</button><p class="sub" style="margin-top:8px">Cuando el celular pregunte, tocá <b>Permitir</b>.</p>`}
 <div class="btns" style="margin-top:12px"><button class="b full" data-act="cerrar">Cerrar</button></div>`);$("sh").dataset.id=""}
async function activarAvisos(){
 try{if(!avisosPosibles()){panelAvisos();return}
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){toast("Tenés que tocar Permitir para recibir avisos");return}
  toast("Activando…");
  const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
  const tok=await fbMsg().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!tok){toast("No se pudo activar. Probá de nuevo.");return}
  const r=await api("registrar",{token:tok,disp:navigator.userAgent.slice(0,120)});
  if(!r.ok){toast(r.error||"No se pudo activar");return}
  ls.set("med_tok",tok);panelAvisos();probarAviso()}
 catch(e){toast("No se pudo activar los avisos: "+(e&&e.message||e))}}
async function probarAviso(){const tok=ls.get("med_tok");if(!tok)return;
 try{const r=await api("probarAviso",{token:tok});toast(r.ok?"Te mandé un aviso de prueba":(r.error||"No se pudo mandar"))}catch(e){toast("No se pudo mandar el aviso")}}
async function apagarAvisos(){const tok=ls.get("med_tok");
 try{if(tok)await api("desregistrar",{token:tok});const m=fbMsg();if(m)await m.deleteToken().catch(()=>{})}catch(e){}
 ls.del("med_tok");toast("Avisos apagados en este aparato");panelAvisos()}
try{if(avisosPosibles()&&Notification.permission==="granted"){fbMsg().onMessage(p=>{const n=p.notification||{};navigator.serviceWorker.ready.then(r=>r.showNotification(n.title||"Médicos",{body:n.body||"",icon:"icon-192.png",badge:"badge-96.png",tag:"fg"}))})}}catch(e){}
</script></body></html>
